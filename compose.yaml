# One stack: the dashboard behind Traefik + a forward-auth middleware.
# Everything deployment-specific comes from .env (see .env.example).
# Put host-only tweaks in compose.override.yaml (ignored by Git, auto-loaded).
name: ${COMPOSE_PROJECT_NAME:-purrbrews-cafe}
services:
  purrbrews-dashboard:
    build: .
    image: ${CAFE_IMAGE:-purrbrews-dashboard:local}
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4174
      DATA_DIR: /app/data
      HA_ENTITIES_FILE: /app/config/home.json
      SERVICES_FILE: /app/config/services.json
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - dashboard-data:/app/data
      - ./config:/app/config:ro
    networks: [proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${PROXY_NETWORK:-proxy}
      - traefik.http.routers.purrbrews-dashboard.rule=Host(`${PUBLIC_HOSTNAME:?Set PUBLIC_HOSTNAME in .env}`)
      - traefik.http.routers.purrbrews-dashboard.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.purrbrews-dashboard.middlewares=${TRAEFIK_AUTH_MIDDLEWARE:-authelia@file}
      - traefik.http.services.purrbrews-dashboard.loadbalancer.server.port=4174
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  dashboard-data:
networks:
  proxy:
    name: ${PROXY_NETWORK:-proxy}
    external: true
